<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MBM ASSISTANT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Modular SDKs loaded via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, enableNetwork } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Inserted configuration from your Firebase screen:
    const firebaseConfig = {
      apiKey: "AIzaSyDclCjEo4haY4JWHU2XCzCq1xoFxEy11dM",
      authDomain: "mbm-assistant.firebaseapp.com",
      projectId: "mbm-assistant",
      storageBucket: "mbm-assistant.firebasestorage.app",
      messagingSenderId: "940429436091",
      appId: "1:940429436091:web:4c80a12e5327b84209f59e",
      measurementId: "G-S0G5EVHF6F"
    };

    window.__FIREBASE_CONFIG__ = firebaseConfig;
    window.__FIREBASE_MODULES__ = { initializeApp, getFirestore, doc, setDoc, onSnapshot, enableNetwork, getAuth, signInAnonymously };
    window.dispatchEvent(new Event('firebase-sdk-ready'));
  </script>
</head>
<body class="bg-black text-zinc-100 antialiased selection:bg-zinc-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_WORKSPACE_KEY = "MBM-ASSISTANT-2026";
    const DEFAULT_WAKE_TIME = "06:30";
    const DEFAULT_SLEEP_TIME = "22:30";

    const PERIODS = [
      { id: 1, label: "P1", start: "08:00", end: "08:40" },
      { id: 2, label: "P2", start: "08:45", end: "09:25" },
      { id: 3, label: "P3", start: "09:30", end: "10:10" },
      { id: 4, label: "P4", start: "10:15", end: "10:55" },
      { id: 5, label: "P5", start: "11:00", end: "11:40" },
      { id: 6, label: "P6", start: "12:20", end: "13:00" },
      { id: 7, label: "P7", start: "13:05", end: "13:45" },
      { id: 8, label: "P8", start: "13:50", end: "14:30" },
      { id: 9, label: "P9", start: "14:35", end: "15:15" },
      { id: 10, label: "P10", start: "15:20", end: "16:00" }
    ];

    const WEEKDAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

    const DEFAULT_TIMETABLE_MATRIX = {
      Monday: ["Computer science", "Computer science", "Mongolian language", "Mongolian language", "Mathematics", "Mathematics", "Geo", "Geo", "Chemistry", "Chemistry"],
      Tuesday: ["Chemistry", "Chemistry", "Global perspectives", "Global perspectives", "Mathematics", "Mathematics", "English", "English", "Geo", "Geo"],
      Wednesday: ["Literature", "PE", "PE", "English", "English", "Chemistry", "Chemistry", "Mathematics", "Mathematics", "Korean"],
      Thursday: ["Mathematics", "Mathematics", "Chemistry", "Chemistry", "Global perspectives", "Global perspectives", "Geo", "Geo", "MS", "Social studies"],
      Friday: ["Mathematics", "Mathematics", "Computer science", "Computer science", "English", "English", "Geo", "Geo", "Korean", "Korean"]
    };

    const SUBJECT_COLORS = {
      "Computer science": "bg-purple-950/80 text-purple-200 border-purple-800/80",
      "Mongolian language": "bg-red-950/90 text-red-200 border-red-800",
      "Mathematics": "bg-emerald-950/80 text-emerald-200 border-emerald-800/80",
      "Geo": "bg-blue-950/80 text-blue-200 border-blue-800/80",
      "Chemistry": "bg-amber-950/80 text-amber-200 border-amber-800/80",
      "Global perspectives": "bg-violet-950/80 text-violet-200 border-violet-800/80",
      "English": "bg-yellow-950/80 text-yellow-200 border-yellow-800/80",
      "Literature": "bg-rose-950/80 text-rose-200 border-rose-800/80",
      "PE": "bg-zinc-900 text-zinc-300 border-zinc-700",
      "Korean": "bg-red-950/80 text-red-300 border-red-700",
      "MS": "bg-zinc-900 text-red-400 border-red-900",
      "Social studies": "bg-zinc-900 text-zinc-300 border-zinc-700"
    };

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [syncStatus, setSyncStatus] = useState("INITIALIZING");
      const [workspaceKey, setWorkspaceKey] = useState(DEFAULT_WORKSPACE_KEY);
      
      const [timetable, setTimetable] = useState(() => {
        const local = localStorage.getItem("mbm_timetable");
        return local ? JSON.parse(local) : DEFAULT_TIMETABLE_MATRIX;
      });

      const [routines, setRoutines] = useState(() => {
        const local = localStorage.getItem("mbm_routines");
        return local ? JSON.parse(local) : [];
      });

      const [tasks, setTasks] = useState(() => {
        const local = localStorage.getItem("mbm_tasks");
        return local ? JSON.parse(local) : [];
      });

      const [hwChecks, setHwChecks] = useState(() => {
        const local = localStorage.getItem("mbm_hw_checks");
        return local ? JSON.parse(local) : {};
      });

      const [wakeTime, setWakeTime] = useState(DEFAULT_WAKE_TIME);
      const [sleepTime, setSleepTime] = useState(DEFAULT_SLEEP_TIME);

      const todayStr = useMemo(() => new Date().toISOString().split("T")[0], []);
      const todayDayIndex = new Date().getDay();
      const currentWeekdayName = todayDayIndex >= 1 && todayDayIndex <= 5 ? WEEKDAYS[todayDayIndex - 1] : null;

      // Persistence helper
      const saveState = (newTimetable, newRoutines, newTasks, newHwChecks) => {
        localStorage.setItem("mbm_timetable", JSON.stringify(newTimetable));
        localStorage.setItem("mbm_routines", JSON.stringify(newRoutines));
        localStorage.setItem("mbm_tasks", JSON.stringify(newTasks));
        localStorage.setItem("mbm_hw_checks", JSON.stringify(newHwChecks));

        if (window.__FIRESTORE_DB__ && window.__SET_DOC__ && window.__DOC_FN__) {
          try {
            const docRef = window.__DOC_FN__(window.__FIRESTORE_DB__, "workspaces", workspaceKey);
            window.__SET_DOC__(docRef, {
              timetable: newTimetable,
              routines: newRoutines,
              tasks: newTasks,
              hwChecks: newHwChecks,
              lastUpdated: Date.now()
            }, { merge: true });
            setSyncStatus("SYNCED (CLOUD)");
          } catch (e) {
            console.error("Cloud push failed:", e);
            setSyncStatus("OFFLINE (CACHED)");
          }
        }
      };

      // Initialize Firebase Connection
      useEffect(() => {
        const setupFirebase = async () => {
          if (!window.__FIREBASE_MODULES__ || !window.__FIREBASE_CONFIG__?.apiKey) {
            setSyncStatus("OFFLINE (CACHED)");
            return;
          }
          try {
            const { initializeApp, getFirestore, doc, setDoc, onSnapshot, getAuth, signInAnonymously } = window.__FIREBASE_MODULES__;
            const app = initializeApp(window.__FIREBASE_CONFIG__);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.__FIRESTORE_DB__ = db;
            window.__SET_DOC__ = setDoc;
            window.__DOC_FN__ = doc;

            await signInAnonymously(auth);

            const docRef = doc(db, "workspaces", workspaceKey);
            onSnapshot(docRef, (snap) => {
              if (snap.exists()) {
                const data = snap.data();
                if (data.timetable) setTimetable(data.timetable);
                if (data.routines) setRoutines(data.routines);
                if (data.tasks) setTasks(data.tasks);
                if (data.hwChecks) setHwChecks(data.hwChecks);
              }
              setSyncStatus("SYNCED (CLOUD)");
            }, (err) => {
              console.warn("Firestore snapshot listener error:", err);
              setSyncStatus("OFFLINE (CACHED)");
            });
          } catch (err) {
            console.error("Firebase init failed:", err);
            setSyncStatus("OFFLINE (CACHED)");
          }
        };

        if (window.__FIREBASE_MODULES__) {
          setupFirebase();
        } else {
          window.addEventListener('firebase-sdk-ready', setupFirebase, { once: true });
        }
      }, [workspaceKey]);

      const toggleHwCheck = (weekday, periodIndex) => {
        const key = `${todayStr}_${weekday}_${periodIndex}`;
        const updated = { ...hwChecks, [key]: !hwChecks[key] };
        setHwChecks(updated);
        saveState(timetable, routines, tasks, updated);
      };

      return (
        <div className="min-h-screen bg-black text-zinc-100 flex flex-col font-sans">
          {/* Header */}
          <header className="border-b border-zinc-800 bg-zinc-950/80 sticky top-0 z-50 backdrop-blur-md px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <span className="font-mono text-sm tracking-widest text-emerald-400 font-bold">MBM // ASSISTANT</span>
              <span className={`text-[10px] font-mono px-2 py-0.5 rounded border ${
                syncStatus.includes("CLOUD") ? "bg-emerald-950/60 border-emerald-800 text-emerald-400" : "bg-zinc-900 border-zinc-700 text-zinc-400"
              }`}>{syncStatus}</span>
            </div>

            {/* Quick Dispatch Links */}
            <div className="flex items-center space-x-2">
              <a href="https://papacambridge.com" target="_blank" rel="noreferrer" className="text-xs font-mono px-2.5 py-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded text-zinc-300">PapaCambridge</a>
              <a href="https://quizlet.com" target="_blank" rel="noreferrer" className="text-xs font-mono px-2.5 py-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded text-zinc-300">Quizlet</a>
              <a href="https://mail.google.com" target="_blank" rel="noreferrer" className="text-xs font-mono px-2.5 py-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded text-zinc-300">Gmail</a>
            </div>
          </header>

          {/* Navigation Bar */}
          <nav className="border-b border-zinc-800 bg-zinc-950 px-4 py-2 flex space-x-2 overflow-x-auto text-xs font-mono">
            {["dashboard", "timetable", "routines", "sync"].map(tab => (
              <button
                key={tab}
                onClick={() => setActiveTab(tab)}
                className={`px-3 py-1.5 rounded uppercase tracking-wider ${
                  activeTab === tab ? "bg-zinc-100 text-black font-bold" : "text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900"
                }`}
              >
                {tab}
              </button>
            ))}
          </nav>

          {/* Tab Content */}
          <main className="flex-1 p-4 max-w-7xl mx-auto w-full">
            {activeTab === "dashboard" && (
              <div className="space-y-6">
                {/* Status Bento */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="p-4 border border-zinc-800 bg-zinc-950 rounded-lg">
                    <div className="text-xs font-mono text-zinc-500 uppercase">Today's Class Schedule</div>
                    <div className="text-lg font-bold mt-1 text-zinc-100">
                      {currentWeekdayName ? `${currentWeekdayName} (10 Periods)` : "Weekend (No Regular Classes)"}
                    </div>
                  </div>

                  <div className="p-4 border border-zinc-800 bg-zinc-950 rounded-lg">
                    <div className="text-xs font-mono text-zinc-500 uppercase">Active Routines Pending</div>
                    <div className="text-lg font-bold mt-1 text-zinc-100">{routines.length} Configured</div>
                  </div>

                  <div className="p-4 border border-zinc-800 bg-zinc-950 rounded-lg">
                    <div className="text-xs font-mono text-zinc-500 uppercase">Cloud Sync Key</div>
                    <div className="text-sm font-mono text-emerald-400 mt-1">{workspaceKey}</div>
                  </div>
                </div>

                {/* Today's Subjects HW Check View */}
                {currentWeekdayName && (
                  <div className="border border-zinc-800 bg-zinc-950 rounded-lg p-4">
                    <div className="text-xs font-mono text-zinc-400 mb-3 uppercase tracking-wide">Today's Subjects — Tap to Cross off HW</div>
                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                      {timetable[currentWeekdayName]?.map((subj, idx) => {
                        const checkKey = `${todayStr}_${currentWeekdayName}_${idx}`;
                        const isDone = hwChecks[checkKey];
                        return (
                          <button
                            key={idx}
                            onClick={() => toggleHwCheck(currentWeekdayName, idx)}
                            className={`p-3 text-left border rounded transition-all ${
                              isDone ? "opacity-30 line-through bg-zinc-900 border-zinc-800 text-zinc-500 grayscale" : "bg-zinc-900/60 border-zinc-700 text-zinc-200 hover:border-zinc-500"
                            }`}
                          >
                            <div className="text-[10px] font-mono text-zinc-500">P{idx + 1}</div>
                            <div className="font-semibold text-xs mt-1 truncate">{subj}</div>
                            <div className="text-[10px] font-mono mt-2">{isDone ? "HW DONE ✓" : "HW PENDING"}</div>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === "timetable" && (
              <div className="border border-zinc-800 bg-zinc-950 rounded-lg p-4 overflow-x-auto">
                <div className="flex items-center justify-between mb-4">
                  <span className="font-mono text-xs uppercase tracking-wider text-zinc-400">Locked Weekly Master Timetable</span>
                  <span className="text-[11px] font-mono text-zinc-500">Click any box to cross off homework</span>
                </div>

                <div className="min-w-[650px]">
                  {/* Table Header */}
                  <div className="grid grid-cols-6 border-b border-zinc-800 pb-2 text-center text-xs font-mono font-bold text-zinc-400 uppercase">
                    <div>Period</div>
                    {WEEKDAYS.map(day => <div key={day}>{day}</div>)}
                  </div>

                  {/* Period Rows */}
                  {PERIODS.map((period, pIdx) => (
                    <React.Fragment key={period.id}>
                      {pIdx === 5 && (
                        <div className="bg-emerald-950/40 border-y border-emerald-900/60 py-1.5 text-center text-[10px] font-mono text-emerald-400 tracking-widest my-1 uppercase">
                          Midday Break & Lunch (11:40 — 12:20)
                        </div>
                      )}
                      <div className="grid grid-cols-6 items-center border-b border-zinc-900/80 py-1.5 text-xs">
                        <div className="text-center font-mono text-zinc-500 text-[10px]">
                          {period.label}<br/>{period.start}
                        </div>
                        {WEEKDAYS.map(day => {
                          const subjectName = timetable[day]?.[pIdx] || "—";
                          const checkKey = `${todayStr}_${day}_${pIdx}`;
                          const isDone = hwChecks[checkKey];
                          const colorStyle = SUBJECT_COLORS[subjectName] || "bg-zinc-900 text-zinc-300 border-zinc-800";

                          return (
                            <div key={day} className="px-1">
                              <button
                                onClick={() => toggleHwCheck(day, pIdx)}
                                className={`w-full p-2 text-center border rounded text-[11px] font-medium transition-all ${
                                  isDone ? "opacity-25 line-through bg-zinc-950 border-zinc-900 text-zinc-600 grayscale" : colorStyle
                                }`}
                              >
                                {subjectName}
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </React.Fragment>
                  ))}
                </div>
              </div>
            )}

            {activeTab === "routines" && (
              <div className="border border-zinc-800 bg-zinc-950 rounded-lg p-4 space-y-4">
                <div className="text-xs font-mono text-zinc-400 uppercase">Routine Manager</div>
                <div className="text-xs text-zinc-500">Add daily or recurring study sessions, chores, or habits here.</div>
                
                <div className="flex gap-2">
                  <input
                    id="newRoutineInput"
                    type="text"
                    placeholder="e.g. Cambridge past paper revision"
                    className="flex-1 bg-zinc-900 border border-zinc-800 px-3 py-2 text-xs rounded text-zinc-200 outline-none focus:border-zinc-500 font-mono"
                  />
                  <button
                    onClick={() => {
                      const el = document.getElementById("newRoutineInput");
                      if (!el.value.trim()) return;
                      const updated = [...routines, { id: Date.now(), title: el.value.trim(), completed: false }];
                      setRoutines(updated);
                      saveState(timetable, updated, tasks, hwChecks);
                      el.value = "";
                    }}
                    className="px-4 py-2 bg-zinc-100 text-black font-mono text-xs font-bold rounded hover:bg-zinc-200"
                  >
                    ADD
                  </button>
                </div>

                <div className="space-y-2 mt-4">
                  {routines.map(r => (
                    <div key={r.id} className="flex items-center justify-between p-3 border border-zinc-800 bg-zinc-900/40 rounded text-xs">
                      <span className={r.completed ? "line-through text-zinc-500" : "text-zinc-200"}>{r.title}</span>
                      <button
                        onClick={() => {
                          const updated = routines.map(item => item.id === r.id ? { ...item, completed: !item.completed } : item);
                          setRoutines(updated);
                          saveState(timetable, updated, tasks, hwChecks);
                        }}
                        className="text-[10px] font-mono text-emerald-400 border border-emerald-900 px-2 py-0.5 rounded"
                      >
                        {r.completed ? "DONE ✓" : "MARK DONE"}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === "sync" && (
              <div className="border border-zinc-800 bg-zinc-950 rounded-lg p-6 max-w-lg mx-auto space-y-4">
                <div className="font-mono text-xs uppercase tracking-wider text-zinc-400">Cloud Sync & Persistence</div>
                <div className="text-xs text-zinc-400 leading-relaxed">
                  Your website connects directly to Google Firestore with your configured keys. Enter your Workspace Sync Key on any device to keep them in sync.
                </div>
                <div>
                  <label className="text-[10px] font-mono text-zinc-500 block mb-1">ACTIVE WORKSPACE SYNC KEY</label>
                  <input
                    type="text"
                    value={workspaceKey}
                    onChange={(e) => setWorkspaceKey(e.target.value.trim())}
                    className="w-full bg-zinc-900 border border-zinc-800 px-3 py-2 text-xs font-mono rounded text-emerald-400 outline-none"
                  />
                </div>
                <div className="text-[11px] font-mono text-zinc-500">Status: <span className="text-zinc-300">{syncStatus}</span></div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
