                                      <h4 className="text-xs font-bold text-zinc-100 truncate uppercase">{r.title}</h4>
                                      <span className="font-mono text-[10px] text-zinc-500">{r.subject} • {getRecurrenceBadgeText(r)}</span>
                                    </div>
                                    <button onClick={() => handleDeleteRoutine(r.id)} className="p-1.5 text-zinc-500 hover:text-red-400">
                                      <Trash2 className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                ))}
                              </div>

                              <div className="space-y-2">
                                <span className="text-[10px] font-mono font-bold uppercase tracking-widest text-zinc-400 flex items-center gap-1.5">
                                  <CheckSquare className="w-3 h-3 text-zinc-500" />
                                  <span>UNTIMED ACTIONS ({untimedList.length})</span>
                                </span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                  {untimedList.map(r => (
                                    <div key={r.id} className={`p-3 border flex items-start justify-between gap-2 ${subtleSurface}`}>
                                      <div>
                                        <h4 className="text-xs font-bold text-zinc-200 uppercase">{r.title}</h4>
                                        <span className="font-mono text-[9px] text-zinc-500 block mt-0.5">{r.subject} • {getRecurrenceBadgeText(r)}</span>
                                      </div>
                                      <button onClick={() => handleDeleteRoutine(r.id)} className="p-1 text-zinc-500 hover:text-red-400">
                                        <Trash2 className="w-3 h-3" />
                                      </button>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* ==========================================
                  TAB 4: HOMEPAGE (DASHBOARD) - ASYMMETRIC BENTO
                ========================================== */}
              {activeTab === 'dashboard' && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                  {/* Primary Left Rail */}
                  <div className="lg:col-span-8 space-y-8">
                    {/* Routine Checklist Bento Box */}
                    <section className={`${cardSurface} p-6 sm:p-8 space-y-6`}>
                      <div className="flex flex-wrap items-center justify-between gap-4 border-b border-zinc-800 pb-4">
                        <div>
                          <h2 className="text-base font-black uppercase font-mono tracking-wider">TODAY'S OPERATIONAL CHECKLIST</h2>
                          <p className="text-xs font-mono text-zinc-500 mt-0.5">
                            TIMED SCHEDULES ON LEFT • UNTIMED FLEXIBLE TARGETS PARALLEL
                          </p>
                        </div>
                        <button
                          onClick={() => setRoutineModalOpen(true)}
                          className="flex items-center gap-1.5 px-3.5 py-1.5 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white"
                        >
                          <Plus className="w-3 h-3" />
                          <span>+ ROUTINE</span>
                        </button>
                      </div>

                      {/* Progress Bar */}
                      <div>
                        <div className="flex items-center justify-between text-xs font-mono font-bold mb-2 uppercase">
                          <span className="text-zinc-500">CYCLE PROGRESS</span>
                          <span className="text-zinc-200">{checklistProgress}% EXECUTED</span>
                        </div>
                        <div className={`w-full h-2 border ${darkMode ? 'bg-zinc-950 border-zinc-800' : 'bg-zinc-200 border-zinc-300'}`}>
                          <div
                            className="h-full bg-zinc-100 transition-all duration-300"
                            style={{ width: `${checklistProgress}%` }}
                          />
                        </div>
                      </div>

                      {todaysRoutines.length === 0 ? (
                        <div className="text-xs font-mono text-zinc-600 py-8 px-4 text-center border border-dashed border-zinc-800 uppercase">
                          NO ROUTINES PROJECTED FOR TODAY. CLICK "+ ROUTINE" TO SCHEDULE.
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                          <div className="md:col-span-7 space-y-2">
                            <span className="text-[10px] font-mono font-bold uppercase tracking-widest text-zinc-400 flex items-center gap-1.5">
                              <Clock className="w-3 h-3 text-zinc-500" />
                              <span>CHRONO TIMED ({todaysTimedRoutines.length})</span>
                            </span>
                            {todaysTimedRoutines.map(task => {
                              const isCompleted = (task.completedDates || []).includes(todayStr);
                              return (
                                <div
                                  key={task.id}
                                  className={`p-3 border grid grid-cols-[64px_1fr_auto] items-center gap-3 transition-colors ${subtleSurface} ${
                                    isCompleted ? 'opacity-40 border-zinc-800' : 'hover:border-zinc-700'
                                  }`}
                                >
                                  <div className="py-1 px-1 border border-zinc-700 bg-zinc-950 text-zinc-300 font-mono text-xs font-bold text-center">
                                    {task.timeOfDay}
                                  </div>
                                  <div
                                    onClick={() => toggleRoutineCompletionOnDate(task.id, todayStr)}
                                    className="flex items-start gap-2.5 cursor-pointer min-w-0"
                                  >
                                    <button
                                      type="button"
                                      className={`mt-0.5 w-4 h-4 flex items-center justify-center border transition-colors ${
                                        isCompleted ? 'bg-zinc-100 border-zinc-100 text-zinc-950' : 'border-zinc-600 hover:border-zinc-400'
                                      }`}
                                    >
                                      {isCompleted && <Check className="w-3 h-3 stroke-[3]" />}
                                    </button>
                                    <div className="min-w-0">
                                      <p className={`text-xs font-bold uppercase truncate ${isCompleted ? 'line-through text-zinc-500' : 'text-zinc-100'}`}>
                                        {task.title}
                                      </p>
                                      <span className="font-mono text-[9px] text-zinc-500">{task.sector} • {task.subject}</span>
                                    </div>
                                  </div>
                                  {!isCompleted && (
                                    <button
                                      onClick={() => rolloverRoutineToTomorrow(task.id)}
                                      title="Roll over to tomorrow"
                                      className="p-1.5 border border-zinc-700 bg-zinc-900 text-zinc-400 hover:text-white"
                                    >
                                      <FastForward className="w-3 h-3" />
                                    </button>
                                  )}
                                </div>
                              );
                            })}
                          </div>

                          <div className="md:col-span-5 space-y-2">
                            <span className="text-[10px] font-mono font-bold uppercase tracking-widest text-zinc-400 flex items-center gap-1.5">
                              <CheckSquare className="w-3 h-3 text-zinc-500" />
                              <span>FLEXIBLE UNTIMED ({todaysUntimedRoutines.length})</span>
                            </span>
                            {todaysUntimedRoutines.map(task => {
                              const isCompleted = (task.completedDates || []).includes(todayStr);
                              return (
                                <div
                                  key={task.id}
                                  className={`p-3 border flex items-center justify-between gap-2 transition-colors ${subtleSurface} ${
                                    isCompleted ? 'opacity-40 border-zinc-800' : 'hover:border-zinc-700'
                                  }`}
                                >
                                  <div
                                    onClick={() => toggleRoutineCompletionOnDate(task.id, todayStr)}
                                    className="flex items-start gap-2.5 cursor-pointer min-w-0 flex-1"
                                  >
                                    <button
                                      type="button"
                                      className={`mt-0.5 w-4 h-4 flex items-center justify-center border transition-colors ${
                                        isCompleted ? 'bg-zinc-100 border-zinc-100 text-zinc-950' : 'border-zinc-600 hover:border-zinc-400'
                                      }`}
                                    >
                                      {isCompleted && <Check className="w-3 h-3 stroke-[3]" />}
                                    </button>
                                    <div className="min-w-0">
                                      <p className={`text-xs font-bold uppercase truncate ${isCompleted ? 'line-through text-zinc-500' : 'text-zinc-100'}`}>
                                        {task.title}
                                      </p>
                                      <span className="font-mono text-[9px] text-zinc-500">{task.sector} • {task.subject}</span>
                                    </div>
                                  </div>
                                  {!isCompleted && (
                                    <button
                                      onClick={() => rolloverRoutineToTomorrow(task.id)}
                                      className="p-1.5 border border-zinc-700 bg-zinc-900 text-zinc-400 hover:text-white shrink-0"
                                    >
                                      <FastForward className="w-3 h-3" />
                                    </button>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </section>

                    {/* Priority Deadlines Section */}
                    <section className={`${cardSurface} p-6 sm:p-8 space-y-6`}>
                      <div className="flex items-center justify-between border-b border-zinc-800 pb-4">
                        <div>
                          <h2 className="text-base font-black uppercase font-mono tracking-wider">UPCOMING PRIORITY DEADLINES</h2>
                          <p className="text-xs font-mono text-zinc-500 mt-0.5">
                            EXAMS (CRITICAL) • MILESTONE PROJECTS • HOMEWORK
                          </p>
                        </div>
                        <button
                          onClick={() => {
                            setNewEventForm(f => ({ ...f, date: todayStr }));
                            setEventModalOpen(true);
                          }}
                          className="px-3 py-1.5 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white flex items-center gap-1.5"
                        >
                          <Plus className="w-3 h-3" />
                          <span>+ EVENT</span>
                        </button>
                      </div>

                      {(workspace.events || []).length === 0 ? (
                        <div className="text-xs font-mono text-zinc-600 py-8 px-4 text-center border border-dashed border-zinc-800 uppercase">
                          NO DEADLINES RECORDED. CLICK "+ EVENT" TO LOG AN EXAM OR ASSIGNMENT.
                        </div>
                      ) : (
                        <div className="space-y-2">
                          {(workspace.events || [])
                            .slice()
                            .sort((a, b) => a.date.localeCompare(b.date))
                            .map(ev => {
                              const daysAway = diffDays(todayStr, ev.date);
                              return (
                                <div key={ev.id} className={`p-4 border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${subtleSurface}`}>
                                  <div>
                                    <div className="flex flex-wrap items-center gap-2">
                                      <span className={`px-2 py-0.2 font-mono text-[9px] font-bold uppercase tracking-wider border ${
                                        ev.category === 'Exam'
                                          ? 'border-red-500 bg-red-950/30 text-red-400'
                                          : ev.category === 'Project'
                                          ? 'border-orange-500 bg-orange-950/30 text-orange-400'
                                          : 'border-blue-500 bg-blue-950/30 text-blue-400'
                                      }`}>
                                        {ev.category} • {ev.priority}
                                      </span>
                                      <span className="font-mono text-[11px] text-zinc-400">
                                        {ev.date} @ {ev.time} ({daysAway === 0 ? 'TODAY' : daysAway === 1 ? 'TOMORROW' : `${daysAway}D REMAINING`})
                                      </span>
                                    </div>
                                    <h3 className="text-sm font-bold uppercase mt-1 text-zinc-100">{ev.title}</h3>
                                    {ev.description && <p className="text-xs font-mono text-zinc-500 mt-0.5">{ev.description}</p>}
                                  </div>
                                  <button
                                    onClick={() => handleDeleteEvent(ev.id)}
                                    className="p-1.5 text-zinc-500 hover:text-red-400 self-end sm:self-center"
                                  >
                                    <Trash2 className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              );
                            })}
                        </div>
                      )}
                    </section>
                  </div>

                  {/* Asymmetric Right Rail */}
                  <div className="lg:col-span-4 space-y-8">
                    {/* Today's Classes */}
                    <section className={`${cardSurface} p-6 sm:p-8 space-y-4`}>
                      <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                        <div>
                          <h2 className="text-sm font-black uppercase font-mono tracking-wider">TODAY'S CLASSES</h2>
                          <p className="font-mono text-[10px] text-zinc-500 uppercase">{FULL_DAYS[now.getDay()]}</p>
                        </div>
                        <span className="font-mono text-xs font-bold text-zinc-300">
                          {todaysHwDoneIds.length}/{todaysClasses.length} HW DONE
                        </span>
                      </div>

                      {todaysClasses.length === 0 ? (
                        <p className="text-xs font-mono text-zinc-600 text-center py-6 uppercase">NO CLASSES REGISTERED FOR TODAY</p>
                      ) : (
                        <div className="space-y-2">
                          {todaysClasses.map((cls, idx) => {
                            const isHwDone = todaysHwDoneIds.includes(cls.id);
                            return (
                              <div
                                key={cls.id}
                                className={`p-3 border flex items-center justify-between gap-3 ${subtleSurface} ${
                                  isHwDone ? 'border-zinc-700 bg-zinc-900/40' : ''
                                }`}
                              >
                                <div className="flex items-center gap-3 min-w-0">
                                  <button
                                    type="button"
                                    onClick={() => toggleHomeworkCheck(todayStr, cls.id)}
                                    className={`w-4 h-4 flex items-center justify-center border transition-colors shrink-0 ${
                                      isHwDone ? 'bg-zinc-100 border-zinc-100 text-zinc-950' : 'border-zinc-600 hover:border-zinc-400'
                                    }`}
                                  >
                                    {isHwDone && <Check className="w-3 h-3 stroke-[3]" />}
                                  </button>
                                  <div className="min-w-0">
                                    <p className={`text-xs font-bold uppercase truncate ${isHwDone ? 'line-through text-zinc-500' : 'text-zinc-200'}`}>
                                      {cls.title}
                                    </p>
                                    <p className="font-mono text-[10px] text-zinc-500">
                                      P{cls.period || idx + 1} • {cls.startTime}–{cls.endTime}
                                    </p>
                                  </div>
                                </div>
                                <span className={`font-mono text-[9px] uppercase px-1.5 py-0.2 border shrink-0 ${
                                  isHwDone ? 'border-emerald-600 text-emerald-400 bg-emerald-950/20' : 'border-zinc-800 text-zinc-500'
                                }`}>
                                  {isHwDone ? 'HW ✓' : 'PENDING'}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </section>

                    {/* 8-Hour Sleep Guardian */}
                    <section className={`${cardSurface} p-6 sm:p-8 space-y-4`}>
                      <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                        <div className="flex items-center gap-2">
                          <Moon className="w-4 h-4 text-zinc-400" />
                          <h2 className="text-sm font-black uppercase font-mono tracking-wider">8H SLEEP GUARDIAN</h2>
                        </div>
                        <span className="font-mono text-xs font-bold text-zinc-200 px-2 py-0.5 border border-zinc-700 bg-zinc-900">
                          TARGET: {sleepCalculation.formattedBedtime}
                        </span>
                      </div>

                      <div className={`p-4 border ${subtleSurface} space-y-2`}>
                        <p className="text-sm font-black font-mono uppercase text-zinc-200">
                          BEDTIME IN {sleepCalculation.hrsLeft}H {sleepCalculation.minsLeft}M
                        </p>
                        <p className="font-mono text-[10px] text-zinc-500 leading-relaxed uppercase">
                          DERIVED FROM FIRST COMMITMENT ({sleepCalculation.earliestTitle} @ {sleepCalculation.earliestTimeStr}) LESS {workspace.wellness?.morningRoutineMins || 60}M ROUTINE BUFFER & 8H SLEEP.
                        </p>
                      </div>

                      <div className="pt-2">
                        <label className="block font-mono text-[10px] uppercase tracking-wider text-zinc-400 mb-1">
                          MORNING BUFFER BEFORE FIRST CLASS (MINUTES)
                        </label>
                        <input
                          type="number"
                          value={workspace.wellness?.morningRoutineMins || 60}
                          onChange={(e) =>
                            updateWorkspace(prev => ({
                              ...prev,
                              wellness: {
                                ...prev.wellness,
                                morningRoutineMins: Math.max(15, Number(e.target.value) || 60)
                              }
                            }), 'Updated morning buffer')
                          }
                          className={`w-full px-3 py-2 text-xs font-mono border ${inputSurface}`}
                        />
                      </div>
                    </section>
                  </div>
                </div>
              )}

              {/* ==========================================
                  TAB 5: CLOUD SYNC
                ========================================== */}
              {activeTab === 'sync' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className={`${cardSurface} p-6 sm:p-8 space-y-6`}>
                    <div className="flex items-center justify-between border-b border-zinc-800 pb-4">
                      <div className="flex items-center gap-3">
                        <Share2 className="w-4 h-4 text-zinc-400" />
                        <div>
                          <h2 className="text-base font-black uppercase font-mono tracking-wider">CLOUD SYNCHRONIZATION</h2>
                          <p className="text-xs font-mono text-zinc-500 uppercase">FIREBASE LIVE REPLICATION PROTOCOL</p>
                        </div>
                      </div>
                      <button
                        onClick={() => {
                          updateWorkspace(getEmptyWorkspace(), 'Wiped workspace');
                          addToast('Workspace Cleared', 'All data reset.', 'check');
                        }}
                        className="px-3 py-1 bg-red-950/20 text-red-400 border border-red-800/80 font-mono text-[10px] font-bold uppercase hover:bg-red-950/40"
                      >
                        WIPE DATA
                      </button>
                    </div>

                    <div className={`p-4 border flex items-center justify-between ${subtleSurface}`}>
                      <div>
                        <span className="font-mono text-[9px] uppercase tracking-widest text-zinc-500 font-bold block">ACTIVE SYNC KEY</span>
                        <p className="text-base font-mono font-black text-zinc-100 mt-0.5">{syncKey}</p>
                      </div>
                      <button
                        onClick={async () => {
                          await safeCopyToClipboard(syncKey);
                          addToast('Key Copied', `Copied ${syncKey} to clipboard.`, 'check');
                        }}
                        className="px-3 py-1.5 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white flex items-center gap-1.5"
                      >
                        <Copy className="w-3.5 h-3.5" />
                        <span>COPY</span>
                      </button>
                    </div>

                    <div className="space-y-2">
                      <label className="block font-mono text-[10px] uppercase tracking-wider text-zinc-400">CONNECT ALTERNATE SYNC KEY</label>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={syncKeyInput}
                          onChange={(e) => setSyncKeyInput(e.target.value.toUpperCase())}
                          placeholder="MBM-CUSTOM-2026"
                          className={`flex-1 px-3 py-2 text-xs font-mono uppercase border ${inputSurface}`}
                        />
                        <button
                          onClick={() => {
                            if (syncKeyInput.trim()) {
                              setSyncKey(syncKeyInput.trim().toUpperCase());
                              addToast('Connected', `Switched to ${syncKeyInput.trim().toUpperCase()}`, 'check');
                            }
                          }}
                          className="px-4 py-2 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white"
                        >
                          CONNECT
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className={`${cardSurface} p-6 sm:p-8 space-y-6`}>
                    <div className="flex items-center justify-between border-b border-zinc-800 pb-4">
                      <div className="flex items-center gap-3">
                        {effectivelyOnline ? <Cloud className="w-4 h-4 text-emerald-400" /> : <CloudOff className="w-4 h-4 text-amber-400" />}
                        <div>
                          <h2 className="text-base font-black uppercase font-mono tracking-wider">OFFLINE MUTATION QUEUE</h2>
                          <p className="text-xs font-mono text-zinc-500 uppercase">OFFLINE CACHE AUTOMATICALLY FLUSHES ON RECONNECT</p>
                        </div>
                      </div>
                      <button
                        onClick={() => setSimulateOffline(!simulateOffline)}
                        className={`px-3 py-1 font-mono text-[10px] font-bold uppercase border ${
                          simulateOffline
                            ? 'bg-amber-400 text-zinc-950 border-amber-300'
                            : 'border-zinc-700 bg-zinc-900 text-zinc-400 hover:text-white'
                        }`}
                      >
                        {simulateOffline ? 'RECONNECT' : 'SIMULATE OFFLINE'}
                      </button>
                    </div>

                    {offlineQueue.length === 0 ? (
                      <div className={`p-6 border text-center ${subtleSurface}`}>
                        <p className="font-mono text-xs text-emerald-400 uppercase font-bold">ALL LOCAL MUTATIONS SYNCHRONIZED.</p>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {offlineQueue.map(item => (
                          <div key={item.id} className="p-3 bg-amber-950/20 border border-amber-800/80 flex items-center justify-between text-xs font-mono">
                            <span className="font-bold text-amber-300 uppercase">{item.label}</span>
                            <span className="text-amber-500 text-[10px]">{item.time}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>

            {/* Mobile Bottom Navigation Bar */}
            <nav className={`lg:hidden fixed bottom-0 inset-x-0 z-40 border-t backdrop-blur-md px-2 py-2 grid grid-cols-5 gap-1 ${
              darkMode ? 'bg-[#060709]/95 border-zinc-800' : 'bg-white/95 border-zinc-300'
            }`}>
              {[
                { id: 'dashboard', label: 'HOME', IconComponent: Compass },
                { id: 'timetable', label: 'MATRIX', IconComponent: Grid },
                { id: 'calendar', label: 'CALENDAR', IconComponent: CalendarIcon },
                { id: 'routines', label: 'ROUTINES', IconComponent: CheckSquare },
                { id: 'sync', label: 'SYNC', IconComponent: Cloud }
              ].map(tab => {
                const IconComp = tab.IconComponent;
                const active = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center py-1 font-mono text-[9px] font-bold uppercase ${
                      active ? 'text-zinc-100 border-b border-zinc-100' : 'text-zinc-500'
                    }`}
                  >
                    <IconComp className="w-3.5 h-3.5 mb-0.5" />
                    <span>{tab.label}</span>
                  </button>
                );
              })}
            </nav>

            {/* Modal: Calendar Day Click & Subject Tasks */}
            {calendarDayModalOpen && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className={`${cardSurface} max-w-2xl w-full p-6 sm:p-8 space-y-6 max-h-[90vh] flex flex-col`}>
                  <div className="flex items-start justify-between gap-4 border-b border-zinc-800 pb-4">
                    <div>
                      <span className="font-mono text-[10px] font-bold uppercase tracking-widest text-zinc-500 block">
                        DOSSIER • DAY SCHEDULE & HW VERIFICATION
                      </span>
                      <h3 className="text-xl font-black uppercase font-mono tracking-tight mt-0.5">
                        {selectedDateBreakdown.dayName}, {selectedCalendarDate}
                      </h3>
                    </div>
                    <button
                      onClick={() => {
                        setActiveSubjectForJob(null);
                        setCalendarDayModalOpen(false);
                      }}
                      className="p-1.5 border border-zinc-700 hover:border-zinc-500 text-zinc-400 hover:text-white"
                    >
                      <X className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-6 pr-1">
                    <div className="space-y-3">
                      <h4 className="font-mono text-xs font-bold uppercase tracking-widest text-zinc-400">
                        SCHEDULED COURSES ({selectedDateBreakdown.hwDoneIds.length}/{selectedDateBreakdown.classes.length} HW CHECKED)
                      </h4>

                      {selectedDateBreakdown.classes.length === 0 ? (
                        <div className={`p-6 border border-dashed border-zinc-800 text-center font-mono text-xs text-zinc-500 uppercase ${subtleSurface}`}>
                          NO TIMETABLE COURSES SCHEDULED ON {selectedDateBreakdown.dayName}.
                        </div>
                      ) : (
                        <div className="space-y-3">
                          {selectedDateBreakdown.classes.map((cls, idx) => {
                            const isHwChecked = selectedDateBreakdown.hwDoneIds.includes(cls.id);
                            const isSelectedForJob = activeSubjectForJob && activeSubjectForJob.id === cls.id;
                            const subjectJobsToday = selectedDateBreakdown.events.filter(
                              ev => (ev.subject || '').toLowerCase() === cls.title.toLowerCase()
                            );

                            return (
                              <div
                                key={cls.id}
                                className={`p-4 border transition-colors space-y-3 ${subtleSurface} ${
                                  isHwChecked ? 'border-zinc-700 bg-zinc-900/60' : ''
                                } ${isSelectedForJob ? 'border-zinc-400 ring-1 ring-zinc-400' : ''}`}
                              >
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                  <div className="flex items-center gap-3.5 min-w-0 flex-1">
                                    <button
                                      type="button"
                                      onClick={() => toggleHomeworkCheck(selectedCalendarDate, cls.id)}
                                      className={`w-5 h-5 flex items-center justify-center border transition-colors shrink-0 ${
                                        isHwChecked
                                          ? 'bg-zinc-100 border-zinc-100 text-zinc-950'
                                          : 'border-zinc-600 hover:border-zinc-400'
                                      }`}
                                    >
                                      {isHwChecked && <Check className="w-3.5 h-3.5 stroke-[3]" />}
                                    </button>

                                    <div className="w-2.5 h-8 shrink-0" style={{ backgroundColor: cls.color || '#3f3f46' }} />

                                    <div
                                      onClick={() => {
                                        setActiveSubjectForJob(isSelectedForJob ? null : cls);
                                        setSubjectJobForm(f => ({ ...f, time: cls.startTime || '09:00' }));
                                      }}
                                      className="min-w-0 flex-1 cursor-pointer"
                                    >
                                      <div className="flex flex-wrap items-center gap-2">
                                        <span className={`text-sm font-bold uppercase truncate ${isHwChecked ? 'line-through text-zinc-500' : 'text-zinc-100'}`}>
                                          {cls.title}
                                        </span>
                                        <span className={`font-mono text-[9px] uppercase px-1.5 py-0.2 border ${
                                          isHwChecked ? 'border-emerald-600 bg-emerald-950/20 text-emerald-400 font-bold' : 'border-zinc-700 text-zinc-400'
                                        }`}>
                                          {isHwChecked ? 'HW COMPLETE ✓' : 'HW PENDING'}
                                        </span>
                                      </div>
                                      <p className="font-mono text-[10px] text-zinc-500 mt-0.5">
                                        PERIOD {cls.period || idx + 1} • {cls.startTime} – {cls.endTime}
                                      </p>
                                    </div>
                                  </div>

                                  <button
                                    type="button"
                                    onClick={() => {
                                      setActiveSubjectForJob(isSelectedForJob ? null : cls);
                                      setSubjectJobForm(f => ({ ...f, time: cls.startTime || '09:00' }));
                                    }}
                                    className={`px-3 py-1.5 font-mono text-[10px] font-bold uppercase border transition-colors flex items-center gap-1.5 shrink-0 ${
                                      isSelectedForJob
                                        ? 'bg-zinc-100 text-zinc-950 border-white'
                                        : 'border-zinc-700 bg-zinc-900 text-zinc-300 hover:border-zinc-500'
                                    }`}
                                  >
                                    <Plus className="w-3 h-3" />
                                    <span>{isSelectedForJob ? 'CLOSE PANEL' : '+ EXAM / HW / PROJECT'}</span>
                                  </button>
                                </div>

                                {subjectJobsToday.length > 0 && (
                                  <div className="pl-8 space-y-1.5">
                                    {subjectJobsToday.map(job => (
                                      <div key={job.id} className="px-3 py-2 border border-zinc-800 bg-black/40 flex items-center justify-between gap-2 text-xs font-mono">
                                        <div className="flex items-center gap-2 min-w-0">
                                          <span className={`px-1.5 py-0.2 text-[9px] font-bold uppercase border shrink-0 ${
                                            job.category === 'Exam'
                                              ? 'border-red-600 bg-red-950/40 text-red-400'
                                              : job.category === 'Project'
                                              ? 'border-orange-600 bg-orange-950/40 text-orange-400'
                                              : 'border-blue-600 bg-blue-950/40 text-blue-400'
                                          }`}>
                                            {job.category}
                                          </span>
                                          <span className="font-bold text-zinc-200 truncate uppercase">{job.title}</span>
                                          {job.description && <span className="text-[10px] text-zinc-500 truncate">— {job.description}</span>}
                                        </div>
                                        <button onClick={() => handleDeleteEvent(job.id)} className="text-zinc-500 hover:text-red-400 p-1">
                                          <Trash2 className="w-3 h-3" />
                                        </button>
                                      </div>
                                    ))}
                                  </div>
                                )}

                                {isSelectedForJob && (
                                  <form onSubmit={handleAddSubjectJobOnDate} className="p-4 border border-zinc-700 bg-black/50 space-y-3">
                                    <span className="font-mono text-[10px] font-bold uppercase tracking-wider text-zinc-300 block">
                                      NEW TARGET LINKED TO: <span className="underline">{cls.title}</span>
                                    </span>

                                    <div className="grid grid-cols-4 gap-1.5">
                                      {[
                                        { id: 'Exam', label: 'EXAM' },
                                        { id: 'Homework', label: 'HOMEWORK' },
                                        { id: 'Project', label: 'PROJECT' },
                                        { id: 'Other', label: 'OTHER' }
                                      ].map(typeOpt => (
                                        <button
                                          key={typeOpt.id}
                                          type="button"
                                          onClick={() => setSubjectJobForm({ ...subjectJobForm, category: typeOpt.id })}
                                          className={`py-1.5 px-2 font-mono text-[10px] font-bold uppercase border transition-colors ${
                                            subjectJobForm.category === typeOpt.id
                                              ? 'bg-zinc-100 text-zinc-950 border-white'
                                              : 'border-zinc-800 bg-zinc-900 text-zinc-400 hover:border-zinc-700'
                                          }`}
                                        >
                                          {typeOpt.label}
                                        </button>
                                      ))}
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                      <input
                                        type="text"
                                        required
                                        placeholder={`Title for ${cls.title}...`}
                                        value={subjectJobForm.title}
                                        onChange={(e) => setSubjectJobForm({ ...subjectJobForm, title: e.target.value })}
                                        className={`sm:col-span-2 px-3 py-2 text-xs font-mono border ${inputSurface}`}
                                      />
                                      <select
                                        value={subjectJobForm.priority}
                                        onChange={(e) => setSubjectJobForm({ ...subjectJobForm, priority: e.target.value })}
                                        className={`px-3 py-2 text-xs font-mono border ${inputSurface}`}
                                      >
                                        <option value="Critical" className="bg-zinc-950 text-white">CRITICAL</option>
                                        <option value="High" className="bg-zinc-950 text-white">HIGH</option>
                                        <option value="Medium" className="bg-zinc-950 text-white">MEDIUM</option>
                                        <option value="Low" className="bg-zinc-950 text-white">LOW</option>
                                      </select>
                                    </div>

                                    <input
                                      type="text"
                                      placeholder="Guidelines, page range, notes..."
                                      value={subjectJobForm.description}
                                      onChange={(e) => setSubjectJobForm({ ...subjectJobForm, description: e.target.value })}
                                      className={`w-full px-3 py-2 text-xs font-mono border ${inputSurface}`}
                                    />

                                    <div className="flex justify-end gap-2 pt-1">
                                      <button type="button" onClick={() => setActiveSubjectForJob(null)} className="px-3 py-1.5 font-mono text-[10px] uppercase text-zinc-500 hover:text-white">
                                        CANCEL
                                      </button>
                                      <button type="submit" className="px-4 py-1.5 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white">
                                        PERSIST TASK
                                      </button>
                                    </div>
                                  </form>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    {/* Routines & Deadlines on Day */}
                    <div className="space-y-3">
                      <h4 className="font-mono text-xs font-bold uppercase tracking-widest text-zinc-400">
                        RECURRING ROUTINES DUE ({selectedDateBreakdown.routines.length})
                      </h4>
                      {selectedDateBreakdown.routines.map(rt => {
                        const isDone = (rt.completedDates || []).includes(selectedCalendarDate);
                        return (
                          <div
                            key={rt.id}
                            onClick={() => toggleRoutineCompletionOnDate(rt.id, selectedCalendarDate)}
                            className={`p-3 border flex items-center justify-between gap-3 cursor-pointer ${subtleSurface}`}
                          >
                            <div className="flex items-center gap-3">
                              <div className={`w-4 h-4 flex items-center justify-center border ${
                                isDone ? 'bg-zinc-100 border-zinc-100 text-zinc-950' : 'border-zinc-600'
                              }`}>
                                {isDone && <Check className="w-3 h-3 stroke-[3]" />}
                              </div>
                              <div>
                                <p className={`text-xs font-bold uppercase ${isDone ? 'line-through text-zinc-500' : 'text-zinc-200'}`}>{rt.title}</p>
                                <p className="font-mono text-[9px] text-zinc-500">{rt.subject} • {getRecurrenceBadgeText(rt)}</p>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    <div className="space-y-3">
                      <h4 className="font-mono text-xs font-bold uppercase tracking-widest text-zinc-400">
                        RECORDED DEADLINES ({selectedDateBreakdown.events.length})
                      </h4>
                      {selectedDateBreakdown.events.map(ev => (
                        <div key={ev.id} className={`p-3 border flex items-center justify-between ${subtleSurface}`}>
                          <div>
                            <span className="font-mono text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.2 border border-zinc-700 bg-zinc-900 text-zinc-300">
                              {ev.category} • {ev.priority}
                            </span>
                            <p className="text-xs font-bold uppercase text-zinc-200 mt-1">{ev.title}</p>
                          </div>
                          <button onClick={() => handleDeleteEvent(ev.id)} className="p-1.5 text-zinc-500 hover:text-red-400">
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="flex justify-end pt-3 border-t border-zinc-800">
                    <button
                      onClick={() => setCalendarDayModalOpen(false)}
                      className="px-5 py-2 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white"
                    >
                      CLOSE
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal: Code Importer */}
            {codeImportModalOpen && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className={`${cardSurface} max-w-2xl w-full p-6 sm:p-8 space-y-4 max-h-[92vh] flex flex-col`}>
                  <div className="flex items-start justify-between gap-4 border-b border-zinc-800 pb-4">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 border border-zinc-700 bg-zinc-900 text-zinc-200 flex items-center justify-center font-mono text-xs">
                        <Terminal className="w-4 h-4" />
                      </div>
                      <div>
                        <h3 className="text-base font-black uppercase font-mono tracking-wider">FLOWTIMETABLE-V1 INGESTION ENGINE</h3>
                        <p className="text-xs font-mono text-zinc-500 uppercase">INJECT STRUCTURED JSON CODE INTO PERSISTENT MATRIX</p>
                      </div>
                    </div>
                    <button onClick={() => setCodeImportModalOpen(false)} className="text-zinc-500 hover:text-white">
                      <X className="w-4 h-4" />
                    </button>
                  </div>

                  <div className={`p-4 border ${subtleSurface} flex flex-wrap items-center justify-between gap-2`}>
                    <span className="font-mono text-[10px] uppercase font-bold text-zinc-400">AUTOMATION MACROS:</span>
                    <div className="flex flex-wrap gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          setCodeImportText(USER_IMAGE_FLOWTIMETABLE_CODE);
                          addToast('Code Loaded', 'Filled uploaded timetable code.', 'check');
                        }}
                        className="px-3 py-1.5 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white flex items-center gap-1.5"
                      >
                        <Sparkles className="w-3.5 h-3.5" />
                        <span>LOAD UPLOADED IMAGE SCHEDULE</span>
                      </button>
                      <button
                        type="button"
                        onClick={async () => {
                          await safeCopyToClipboard(AI_TIMETABLE_PROMPT_TEMPLATE);
                          addToast('Prompt Copied', 'Paste into any AI.', 'check');
                        }}
                        className="px-3 py-1.5 border border-zinc-700 bg-zinc-900 text-zinc-300 hover:text-white text-xs font-mono font-bold uppercase tracking-wider flex items-center gap-1.5"
                      >
                        <Copy className="w-3.5 h-3.5" />
                        <span>COPY AI PROMPT</span>
                      </button>
                    </div>
                  </div>

                  <form onSubmit={handleImportTimetableCode} className="flex-1 flex flex-col space-y-3 min-h-0">
                    <textarea
                      rows={9}
                      value={codeImportText}
                      onChange={(e) => setCodeImportText(e.target.value)}
                      placeholder="Paste FLOWTIMETABLE-V1 JSON code here..."
                      className={`w-full flex-1 p-3 font-mono text-xs border ${inputSurface}`}
                    />

                          onChange={(e) => setNewEventForm({ ...newEventForm, date: e.target.value })}
                          className={`w-full px-3 py-2 text-xs font-mono border ${inputSurface}`}

                        {(workspace.timetable || [])
                          .filter(c => c.title.toLowerCase() === activeDossierSubject.title.toLowerCase())
                          .sort((a, b) => Number(a.day) - Number(b.day) || Number(a.period) - Number(b.period))
                          .map(slot => {
                            const slotDateStr = getWeekDateForDayNumber(Number(slot.day), now);
                            const isSlotDone = ((workspace.homeworkChecks || {})[slotDateStr] || []).includes(slot.id);

                            return (
                              <div
                                key={slot.id}
                                className={`p-3 border flex items-center justify-between gap-2.5 ${subtleSurface} ${
                                  isSlotDone ? 'opacity-40' : ''
                                }`}
                              >
                                <div className="flex items-center gap-2 min-w-0">
                                  <button
                                    type="button"
                                    onClick={() => toggleHomeworkCheck(slotDateStr, slot.id)}
                                    className={`w-4 h-4 flex items-center justify-center border transition-colors shrink-0 ${
                                      isSlotDone ? 'bg-zinc-100 border-zinc-100 text-zinc-950' : 'border-zinc-600 hover:border-zinc-400'
                                    }`}
                                  >
                                    {isSlotDone && <Check className="w-3 h-3 stroke-[3]" />}
                                  </button>
                                  <div className="min-w-0">
                                    <p className={`text-xs font-bold uppercase truncate ${isSlotDone ? 'line-through text-zinc-500' : 'text-zinc-200'}`}>
                                      {FULL_DAYS[slot.day]} (P{slot.period})
                                    </p>
                                    <span className="font-mono text-[10px] text-zinc-500">
                                      {slot.startTime}–{slot.endTime} • {slot.room || `Period ${slot.period}`}
                                    </span>
                                  </div>
                                </div>
                                <span className={`font-mono text-[9px] uppercase px-1.5 py-0.2 border shrink-0 ${
                                  isSlotDone ? 'border-emerald-600 bg-emerald-950/20 text-emerald-400' : 'border-zinc-800 text-zinc-500'
                                }`}>
                                  {isSlotDone ? 'HW DONE ✓' : 'HW OPEN'}
                                </span>
                              </div>
                            );
                          })}
                      </div>
                    </div>

                    {/* 2. Scheduled Deadlines across all dates */}
                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <h4 className="font-mono text-xs font-bold uppercase tracking-widest text-zinc-400 flex items-center gap-2">
                          <CalendarIcon className="w-3.5 h-3.5 text-zinc-500" />
                          <span>SCHEDULED EXAMS, HOMEWORK & PROJECTS</span>
                        </h4>
                      </div>

                      {(() => {
                        const subjectEvents = (workspace.events || []).filter(
                          ev => (ev.subject || '').toLowerCase() === activeDossierSubject.title.toLowerCase()
                        );

                        if (subjectEvents.length === 0) {
                          return (
                            <div className="p-4 border border-dashed border-zinc-800 text-center font-mono text-xs text-zinc-500 uppercase">
                              NO ACTIVE DEADLINES RECORDED FOR {activeDossierSubject.title}.
                            </div>
                          );
                        }

                        return (
                          <div className="space-y-2">
                            {subjectEvents
                              .slice()
                              .sort((a, b) => a.date.localeCompare(b.date))
                              .map(ev => {
                                const daysAway = diffDays(todayStr, ev.date);
                                return (
                                  <div key={ev.id} className={`p-3 border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${subtleSurface}`}>
                                    <div className="space-y-1">
                                      <div className="flex flex-wrap items-center gap-2">
                                        <span className={`px-1.5 py-0.2 font-mono text-[9px] font-bold uppercase border ${
                                          ev.category === 'Exam'
                                            ? 'border-red-600 bg-red-950/40 text-red-300'
                                            : ev.category === 'Project'
                                            ? 'border-orange-600 bg-orange-950/40 text-orange-300'
                                            : 'border-blue-600 bg-blue-950/40 text-blue-300'
                                        }`}>
                                          {ev.category} • {ev.priority}
                                        </span>
                                        <span className="font-mono text-[11px] text-zinc-400">
                                          {ev.date} @ {ev.time} ({daysAway === 0 ? 'TODAY' : daysAway === 1 ? 'TOMORROW' : `${daysAway}D AWAY`})
                                        </span>
                                      </div>
                                      <p className="text-xs font-bold uppercase text-zinc-100">{ev.title}</p>
                                      {ev.description && <p className="text-[11px] font-mono text-zinc-500">{ev.description}</p>}
                                    </div>
                                    <button
                                      onClick={() => handleDeleteEvent(ev.id)}
                                      className="p-1.5 text-zinc-500 hover:text-red-400 self-end sm:self-center"
                                      title="Delete task"
                                    >
                                      <Trash2 className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                );
                              })}
                          </div>
                        );
                      })()}
                    </div>

                    {/* 3. Recurring Routines linked to this Subject */}
                    <div className="space-y-2">
                      <h4 className="font-mono text-xs font-bold uppercase tracking-widest text-zinc-400 flex items-center gap-2">
                        <CheckSquare className="w-3.5 h-3.5 text-zinc-500" />
                        <span>LINKED RECURRING ROUTINES</span>
                      </h4>
                      {(() => {
                        const subjectRoutines = (workspace.routines || []).filter(
                          rt => (rt.subject || '').toLowerCase() === activeDossierSubject.title.toLowerCase()
                        );

                        if (subjectRoutines.length === 0) {
                          return (
                            <div className="p-3 border border-dashed border-zinc-800 text-center font-mono text-xs text-zinc-600 uppercase">
                              NO RECURRING HABITS OR ROUTINES ATTACHED.
                            </div>
                          );
                        }

                        return (
                          <div className="space-y-1.5">
                            {subjectRoutines.map(rt => {
                              const isDoneToday = (rt.completedDates || []).includes(todayStr);
                              return (
                                <div key={rt.id} className={`p-2.5 border flex items-center justify-between ${subtleSurface}`}>
                                  <div className="flex items-center gap-2.5 min-w-0">
                                    <span className="font-mono text-xs text-zinc-400">{isDoneToday ? '✓' : '•'}</span>
                                    <span className={`text-xs font-bold uppercase truncate ${isDoneToday ? 'line-through text-zinc-500' : 'text-zinc-200'}`}>
                                      {rt.title}
                                    </span>
                                  </div>
                                  <span className="font-mono text-[9px] text-zinc-500 shrink-0">
                                    {getRecurrenceBadgeText(rt)} {rt.timeOfDay ? `@ ${rt.timeOfDay}` : ''}
                                  </span>
                                </div>
                              );
                            })}
                          </div>
                        );
                      })()}
                    </div>

                    {/* 4. Instant Action Logger for this Subject */}
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (!dossierQuickTask.title.trim()) return;
                        const item = {
                          id: `ev-subj-${Date.now()}`,
                          title: dossierQuickTask.title.trim(),
                          category: dossierQuickTask.category,
                          priority: dossierQuickTask.category === 'Exam' ? 'Critical' : dossierQuickTask.priority,
                          date: dossierQuickTask.date || todayStr,
                          time: dossierQuickTask.time || '18:00',
                          subject: activeDossierSubject.title,
                          description: ''
                        };
                        updateWorkspace(prev => ({
                          ...prev,
                          events: [...(prev.events || []), item]
                        }), `Added ${item.category} for ${item.subject}`);
                        setDossierQuickTask(prev => ({ ...prev, title: '' }));
                        addToast('Dossier Task Added', `Scheduled for ${item.subject} on ${item.date}.`, 'check');
                      }}
                      className="p-4 border border-zinc-800 bg-black/40 space-y-3"
                    >
                      <div className="flex items-center justify-between">
                        <span className="font-mono text-[10px] font-bold uppercase tracking-wider text-zinc-300">
                          + QUICK LOG TARGET FOR {activeDossierSubject.title}
                        </span>
                      </div>

                      <div className="grid grid-cols-4 gap-1.5">
                        {['Exam', 'Homework', 'Project', 'General'].map(cat => (
                          <button
                            key={cat}
                            type="button"
                            onClick={() => setDossierQuickTask(prev => ({ ...prev, category: cat }))}
                            className={`py-1 px-2 font-mono text-[9px] font-bold uppercase border transition-colors ${
                              dossierQuickTask.category === cat
                                ? 'bg-zinc-100 text-zinc-950 border-white'
                                : 'border-zinc-800 bg-zinc-900 text-zinc-400 hover:border-zinc-700'
                            }`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input
                          type="text"
                          required
                          placeholder={`e.g. Chapter 4 Problem Set...`}
                          value={dossierQuickTask.title}
                          onChange={(e) => setDossierQuickTask(prev => ({ ...prev, title: e.target.value }))}
                          className={`sm:col-span-2 px-3 py-2 text-xs font-mono border ${inputSurface}`}
                        />
                        <input
                          type="date"
                          value={dossierQuickTask.date}
                          onChange={(e) => setDossierQuickTask(prev => ({ ...prev, date: e.target.value }))}
                          className={`px-3 py-2 text-xs font-mono border ${inputSurface}`}
                        />
                      </div>

                      <div className="flex justify-end pt-1">
                        <button
                          type="submit"
                          className="px-4 py-1.5 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white"
                        >
                          ADD TO SUBJECT PLAN
                        </button>
                      </div>
                    </form>
                  </div>

                  {/* Modal Footer */}
                  <div className="flex justify-end pt-3 border-t border-zinc-800">
                    <button
                      type="button"
                      onClick={() => {
                        setSubjectDossierModalOpen(false);
                        setActiveDossierSubject(null);
                      }}
                      className="px-5 py-2 bg-zinc-100 text-zinc-950 hover:bg-white text-xs font-mono font-bold uppercase tracking-wider border border-white"
                    >
                      CLOSE DOSSIER
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }
      /* ========================================================================= */
      /* END OF UNTOUCHED TSX FILE                                                 */
      /* ========================================================================= */

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    }

    // Wait until Firebase Modules are loaded by the browser, then boot the React app
    if (window.FIREBASE_IMPORTS) {
      launchApplication();
    } else {
      window.addEventListener('modules-loaded', launchApplication);
    }
  </script>
</body>
</html>
